[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-chat-backend"
version = "0.1.0"
description = "Production-grade chat backend for MCP Process Server"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arken AI", email = "info@arken.ai" }]
keywords = ["mcp", "chat", "backend", "fastapi", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # FastAPI and ASGI server
    "fastapi>=0.110.0,<0.120.0",
    "uvicorn[standard]>=0.27.0,<0.30.0",

    # Database clients
    "redis[hiredis]>=5.0.1,<6.0.0",
    "motor>=3.3.2,<4.0.0",          # Async MongoDB driver
    "pymongo>=4.6.1,<5.0.0",        # Sync MongoDB (for compatibility)

    # Task queue
    "rq>=1.16.0,<2.0.0",

    # LLM providers
    "anthropic>=0.70.0,<1.0.0",
    "google-genai>=0.3.0,<1.0.0",

    # Configuration and validation
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",

    # Utilities
    "python-multipart>=0.0.6,<0.1.0", # For file uploads

    # Report generation
    "reportlab>=4.0.0,<5.0.0", # PDF generation
    "Pillow>=10.0.0,<11.0.0",  # Image processing
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "httpx>=0.26.0,<0.28.0",          # For testing FastAPI

    # Code quality
    "ruff>=0.2.0,<0.3.0",
    "black>=24.1.0,<25.0.0",
    "mypy>=1.8.0,<2.0.0",

    # Development tools
    "ipython>=8.20.0,<9.0.0",
    "ipdb>=0.13.13,<0.14.0",
]

[project.urls]
Homepage = "https://github.com/Arken-AI/calculation_engine"
Repository = "https://github.com/Arken-AI/calculation_engine"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = ["-v", "--cov=app", "--cov-report=html", "--cov-report=term-missing"]
markers = [
    "integration: marks tests as integration tests (require real services)",
    "slow: marks tests as slow (real API calls, expensive)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"] # unused imports in __init__.py

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["anthropic.*", "motor.*", "pymongo.*", "redis.*", "rq.*"]
ignore_missing_imports = true
